components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session established via better-auth. In this app the session is typically carried
        via an httpOnly cookie set by `/api/auth/*`; the bearer scheme is shown here for
        tooling convenience when testing with a token.

  parameters:
    CultId:
      name: cultId
      in: path
      required: true
      schema: { type: string }
    CultSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string }
    PortfolioItemId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ListingId:
      name: id
      in: path
      required: true
      schema: { type: string }
    CreativeProfileId:
      name: creativeProfileId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not permitted (wrong role / unverified email)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data: {}
        message:
          type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    PaginatedEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items: {}
        message:
          type: string
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        statusCode:
          type: integer
        context:
          type: object
          additionalProperties: true
        stack:
          type: string

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        method:
          type: string
        statusCode:
          type: integer

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    EducationItem:
      type: object
      required: [school, degree, fieldOfStudy, country, yearOfGraduation]
      properties:
        school:
          type: string
          minLength: 2
        degree:
          type: string
          description: e.g. BACHELORS, MASTERS, PHD, ASSOCIATE, DIPLOMA
        fieldOfStudy:
          type: string
          minLength: 2
        country:
          type: string
          minLength: 2
        yearOfGraduation:
          type: string
          pattern: '^(19|20)\d{2}$'

    ExperienceItem:
      type: object
      required: [title, employmentType, companyName, industry, startDate]
      properties:
        title:
          type: string
          minLength: 2
        employmentType:
          type: string
          description: e.g. FULL_TIME, PART_TIME, CONTRACT, FREELANCE, INTERNSHIP
        companyName:
          type: string
        industry:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        currentlyWorking:
          type: boolean
          default: false
        description:
          type: string
        skills:
          type: array
          items:
            type: string
          default: []

    CreativeOnboardingInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
        headline:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              expertise:
                type: string
                enum: [BEGINNER, INTERMEDIATE, EXPERT]
        education:
          type: array
          items:
            $ref: '#/components/schemas/EducationItem'
        experience:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceItem'
        resumeUrl:
          type: string
        resumePublicId:
          type: string

    ListingInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
          minLength: 20
          maxLength: 2000
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CLOSED, ARCHIVED]
        locationType:
          type: string
          description: e.g. REMOTE, ONSITE, HYBRID
        location:
          type: string
          maxLength: 100
        budgetMin:
          type: integer
          minimum: 1
        budgetMax:
          type: integer
          minimum: 1
        rateType:
          type: string
          description: e.g. HOURLY, FIXED, NEGOTIABLE
        currency:
          type: string
        employmentType:
          type: string
          description: e.g. FULL_TIME, PART_TIME, CONTRACT, FREELANCE, INTERNSHIP
        skills:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 20
        deadline:
          type: string
          format: date-time
        startDate:
          type: string
          format: date-time
        duration:
          type: string
          maxLength: 50
